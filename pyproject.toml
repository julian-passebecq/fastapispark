[project]
name = "datapass-fake-spark"
version = "0.1.0"
description = "Stateless Spark simulation runtime for Datapass Studio."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi[standard]>=0.128,<1.0",
  "duckdb>=1.4,<2.0",
  "pydantic>=2.10,<3.0"
]

[dependency-groups]
dev = ["pytest>=8.3,<10.0", "httpx>=0.28,<1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
